[project]
name = "uc-metadata-platform"
version = "0.1.0"
description = "Contract-driven metadata for Unity Catalog datasets: harvest, AI-propose, review, apply, measure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4",
    "databricks-sdk>=0.30",
    "anthropic>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ucmeta = "uc_metadata.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `pytest` import `uc_metadata` straight from `src/` without an editable install,
# so the fast inner loop (NFR: "unit tests run against the in-repo fake ... need no
# network at all") doesn't also need a packaging step.
pythonpath = ["src"]
testpaths = ["tests"]
# Default collection glob (`test_*.py`/`*_test.py`) plus demo_scenario.py by
# name: tests/e2e/demo_scenario.py is a runnable script first (`python
# tests/e2e/demo_scenario.py [--live]`) and a pytest module second, and its
# name is what the spec/build verdict names explicitly -- renaming it to
# test_demo_scenario.py to satisfy pytest's default glob would fight that.
python_files = ["test_*.py", "demo_scenario.py"]
markers = [
    "scenario: binds a test to a scenario ID in specs/F-PLATFORM-001-uc-metadata-contracts.md or specs/F-PLATFORM-002-coverage-history-and-native-dashboard.md",
    "uc_live: exercises RealUCClient against the live Free Edition workspace; needs network and the ucmeta OAuth profile, gated by UC_LIVE_TESTS=1",
    "llm_live: makes a real Anthropic API call and records a fixture; needs ANTHROPIC_API_KEY, gated by LLM_LIVE_TESTS=1",
]
