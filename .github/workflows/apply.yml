# Apply-on-merge gate (spec: F-PLATFORM-001, Dependencies -> Build verdicts,
# ".github/workflows/apply.yml"; Rules & Constraints "apply runs only on merge
# to the main branch -- change requests may validate and dry-run, never
# apply"). This workflow is the forcing function `validate.yml` alone cannot
# be: it demonstrates apply wired to `main`, not to a manually clicked button.
#
# Layer 1 of F-PLATFORM-003 / ADR-009: this job runs as `ucmeta-ci-apply`, a
# non-human service principal with only the grants apply.py needs on the
# three demo tables (see scripts/provision_ci_apply_identity.sh and
# docs/ci-service-principal.md) -- never as a person, and never with a
# personal access token.
#
# Fork-safe by construction, not by oversight (SC-003-04): the "write a
# credentials profile, then apply --live" step only runs when
# DATABRICKS_CI_HOST / DATABRICKS_CI_CLIENT_ID / DATABRICKS_CI_CLIENT_SECRET
# are all configured as repository secrets. A fork or clone with none of
# those configured -- the interview-panel case F-PLATFORM-001 guarantees --
# takes the other branch below: it runs the exact same apply-on-merge
# mechanism against the in-repository `FakeUCClient`, says plainly that no
# automation credential is configured, and still exits successfully. Which
# branch ran is unmistakable in the job's own printed output, and no step in
# this file ever echoes a secret value.
name: apply

on:
  push:
    branches: [main]

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # Full history so the pre-push SHA (github.event.before) is
          # resolvable locally -- see the changed-file diff step below.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11" # pyproject.toml: requires-python = ">=3.11"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # ---- CI machine identity, wired only if it's actually configured -------
      # Reads the three secrets into env vars (never interpolated into `if:`
      # expressions or echoed) and reports only whether all three are
      # present. A fork or clone with none configured gets empty env vars
      # here and `configured=false`, which is exactly SC-003-04's case.
      - name: Check whether a CI apply credential is configured
        id: credential
        env:
          DATABRICKS_CI_HOST: ${{ secrets.DATABRICKS_CI_HOST }}
          DATABRICKS_CI_CLIENT_ID: ${{ secrets.DATABRICKS_CI_CLIENT_ID }}
          DATABRICKS_CI_CLIENT_SECRET: ${{ secrets.DATABRICKS_CI_CLIENT_SECRET }}
        run: |
          if [ -n "$DATABRICKS_CI_HOST" ] && [ -n "$DATABRICKS_CI_CLIENT_ID" ] && [ -n "$DATABRICKS_CI_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "A CI apply credential is configured; this run will apply live as ucmeta-ci-apply."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No CI apply credential is configured (DATABRICKS_CI_HOST / DATABRICKS_CI_CLIENT_ID / DATABRICKS_CI_CLIENT_SECRET); this run will demonstrate the apply-on-merge mechanism against the in-repository fake catalogue instead."
          fi

      # Writes a `~/.databrickscfg` profile from the three secrets -- the seam
      # F-PLATFORM-003's build verdict recommends: RealUCClient.__init__
      # already resolves an arbitrary named profile (confirmed live,
      # 2026-09-19: `--profile ucmeta-ci` against a hand-authenticated local
      # profile worked end-to-end with zero code changes), so CI only needs
      # to make that profile exist before the job runs. Only ever runs when
      # step `credential` found all three secrets present; never prints their
      # values, only that the file was written.
      # `discovery_url` is the real fix for a genuine SDK-level hang, found
      # by reading databricks/sdk/config.py directly (site-packages, this
      # exact installed version) after two wrong guesses cost ~10 minutes of
      # real CI time each: `_resolve_host_metadata()` always probes the
      # workspace's own `/.well-known/databricks-config` endpoint before
      # falling back to explicit config, UNLESS `discovery_url` is already
      # set -- its own comment says as much: "otherwise it uses the default
      # 300s retry budget, which blocks Config() initialization for ~5
      # minutes when the host is unreachable." Adding `auth_type = oauth-m2m`
      # alone (a prior attempt on this branch's history) did not skip this --
      # only a pre-set discovery_url does, per the source. The value is the
      # standard Databricks OIDC discovery path for this host, not a secret:
      # `<host>/oidc/.well-known/oauth-authorization-server`, confirmed
      # correct by a local diagnostic against this exact workspace before
      # ever being written here.
      - name: Write the CI apply Databricks profile
        if: steps.credential.outputs.configured == 'true'
        env:
          DATABRICKS_CI_HOST: ${{ secrets.DATABRICKS_CI_HOST }}
          DATABRICKS_CI_CLIENT_ID: ${{ secrets.DATABRICKS_CI_CLIENT_ID }}
          DATABRICKS_CI_CLIENT_SECRET: ${{ secrets.DATABRICKS_CI_CLIENT_SECRET }}
        run: |
          {
            echo "[ucmeta-ci-apply]"
            echo "host = ${DATABRICKS_CI_HOST}"
            echo "client_id = ${DATABRICKS_CI_CLIENT_ID}"
            echo "client_secret = ${DATABRICKS_CI_CLIENT_SECRET}"
            echo "auth_type = oauth-m2m"
            echo "discovery_url = ${DATABRICKS_CI_HOST}/oidc/.well-known/oauth-authorization-server"
          } >> ~/.databrickscfg
          echo "Wrote a ucmeta-ci-apply OAuth M2M profile to ~/.databrickscfg (values not printed)."

      # ---- changed-file discovery --------------------------------------------
      # Mechanism: `git diff --name-only <before>..<after>`, where `before`/
      # `after` come from the push event payload (github.event.before is the
      # branch tip before this push landed, github.event.after == github.sha).
      # This is the merge commit's actual parent for an ordinary merge, but
      # unlike `HEAD^` it also does the right thing for a squash-merge or a
      # multi-commit fast-forward push, since it reflects everything the push
      # actually moved main by, not just the immediate parent commit.
      #
      # `github.event.before` is the all-zero SHA on a branch's very first
      # push (not expected for `main` in this repository, which already has
      # history) -- guarded below rather than assumed away.
      - name: List changed paths
        id: changed
        run: |
          before_sha="${{ github.event.before }}"
          after_sha="${{ github.event.after }}"
          zero_sha="0000000000000000000000000000000000000000"
          if [ "${before_sha}" = "${zero_sha}" ]; then
            echo "No previous commit to diff against (first push to main); nothing to apply."
            : > changed_paths.txt
          else
            git diff --name-only "${before_sha}" "${after_sha}" > changed_paths.txt
          fi
          echo "Changed paths in this push:"
          cat changed_paths.txt

      # Same carve-out as validate.yml: contracts/_schema/** and
      # contracts/_template.yaml are platform artifacts, not authored
      # contracts, and are never applied.
      - name: Find changed contract files
        id: contracts
        run: |
          grep -E '^contracts/.*\.yaml$' changed_paths.txt \
            | grep -v '^contracts/_schema/' \
            | grep -v '^contracts/_template\.yaml$' \
            > changed_contracts.txt || true
          echo "Changed contract files:"
          cat changed_contracts.txt || echo "(none)"
          count=$(wc -l < changed_contracts.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # `--approved-by` names the human whose approval authorizes this apply
      # (apply.py's own precondition). `github.actor` is the account that
      # triggered this workflow run -- for a push produced by merging a PR
      # through the GitHub UI, that is the person who clicked merge, which is
      # the closest identity GitHub Actions exposes to "who approved this
      # change landing on main" without a second API call to resolve the PR's
      # reviewers.
      #
      # Two mutually exclusive steps below, gated on `steps.credential`'s
      # output rather than one step branching internally, so which one ran is
      # visible directly in the job's step list, not just in its log text
      # (SC-003-04: "unmistakable in the job's output").
      - name: ucmeta apply each changed contract (live, as ucmeta-ci-apply)
        if: steps.contracts.outputs.count != '0' && steps.credential.outputs.configured == 'true'
        run: |
          echo "Applying live against the real Unity Catalog workspace as ucmeta-ci-apply."
          failures=0
          while IFS= read -r contract; do
            echo "::group::ucmeta apply ${contract} --live --profile ucmeta-ci-apply"
            uv run ucmeta apply "${contract}" --live --profile ucmeta-ci-apply --approved-by "${{ github.actor }}" || failures=1
            echo "::endgroup::"
          done < changed_contracts.txt
          exit "${failures}"

      - name: ucmeta apply each changed contract (fake -- no CI credential configured)
        if: steps.contracts.outputs.count != '0' && steps.credential.outputs.configured == 'false'
        run: |
          echo "No CI apply credential is configured for this repository/fork."
          echo "Demonstrating the apply-on-merge mechanism against the in-repository FakeUCClient instead of a real Databricks workspace. No live write is attempted."
          failures=0
          while IFS= read -r contract; do
            echo "::group::ucmeta apply ${contract} (fake)"
            uv run ucmeta apply "${contract}" --approved-by "${{ github.actor }}" || failures=1
            echo "::endgroup::"
          done < changed_contracts.txt
          exit "${failures}"

      - name: No contracts changed
        if: steps.contracts.outputs.count == '0'
        run: echo "No contract files changed in this push; nothing to apply."
